<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Esto me gusta</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <header class="cabecera">
        <h1><i class="ti ti-tools-kitchen-2"></i> Esto me gusta</h1>
        <div class="cabecera-derecha">
            <div id="auth-zona">
                <div id="auth-login" class="auth-inline">
                    <input type="password" id="auth-password" placeholder="Contraseña">
                    <button id="btn-login" class="btn btn-cabecera btn-pequeno">Entrar</button>
                </div>
                <div id="auth-logueado" class="oculto" style="display: flex; align-items: center; gap: 0.5rem;">
                    <button id="btn-logout" class="btn btn-cabecera btn-pequeno"><i class="ti ti-logout"></i> Salir</button>
                </div>
            </div>
            <nav>
                <a href="/dashboard.html" class="activo"><i class="ti ti-list-details"></i> Dashboard</a>
                <a href="/escaner.html"><i class="ti ti-camera"></i> Cámara</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">

        <!-- Pestañas -->
        <div class="pestanas">
            <button class="pestana activa" data-pestana="listado"><i class="ti ti-shopping-cart"></i> Productos</button>
            <button class="pestana" data-pestana="papelera"><i class="ti ti-trash"></i> Papelera</button>
        </div>

        <!-- Pestaña: Listado -->
        <section id="pestana-listado">
            <div class="barra-filtros">
                <div class="busqueda-wrapper">
                    <i class="ti ti-search busqueda-icono"></i>
                    <input type="search" id="filtro-busqueda" placeholder="Buscar por nombre...">
                </div>
                <select id="filtro-valoracion">
                    <option value="todos">Todas las valoraciones</option>
                    <option value="me_gusta">Me gusta</option>
                    <option value="pse">Psé</option>
                    <option value="no_me_gusta">No me gusta</option>
                </select>
                <select id="filtro-revision">
                    <option value="todos">Todos</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="revisados">Revisados</option>
                </select>
                <select id="filtro-orden">
                    <option value="fecha_alta-desc">Más recientes</option>
                    <option value="fecha_alta-asc">Más antiguos</option>
                    <option value="nombre-asc">Nombre A-Z</option>
                    <option value="nombre-desc">Nombre Z-A</option>
                </select>
            </div>

            <div id="lista-productos" class="tabla-productos"></div>
            <div id="lista-vacia" class="estado-vacio oculto">
                <p>No hay productos que mostrar</p>
            </div>
        </section>

        <!-- Pestaña: Papelera -->
        <section id="pestana-papelera" class="oculto">
            <div id="papelera-acciones" class="oculto" style="margin-bottom: 1rem; text-align: right;">
                <button id="btn-vaciar-papelera" class="btn btn-peligro btn-pequeno">
                    Vaciar papelera
                </button>
            </div>
            <div id="lista-papelera" class="tabla-productos"></div>
            <div id="papelera-vacia" class="estado-vacio oculto">
                <p>La papelera está vacía</p>
            </div>
        </section>
    </main>

    <!-- Modal de edición -->
    <div id="modal-editar" class="modal-fondo oculto">
        <div class="modal">
            <h2>Editar producto</h2>

            <div class="campo">
                <label for="editar-nombre">Nombre</label>
                <input type="text" id="editar-nombre">
            </div>

            <div class="campo">
                <label for="editar-codigo">Código de barras</label>
                <input type="text" id="editar-codigo">
            </div>

            <div class="campo">
                <label>Valoración</label>
                <div id="editar-valoracion" class="valoracion-selector">
                    <button type="button" data-valor="me_gusta"><i class="ti ti-thumb-up"></i> Me gusta</button>
                    <button type="button" data-valor="pse"><i class="ti ti-minus"></i> Psé</button>
                    <button type="button" data-valor="no_me_gusta"><i class="ti ti-thumb-down"></i> No me gusta</button>
                </div>
            </div>

            <div class="campo">
                <label for="editar-notas">Notas</label>
                <textarea id="editar-notas"></textarea>
            </div>

            <div class="campo">
                <label>Foto</label>
                <div class="editar-foto-layout">
                    <div id="editar-foto-actual"></div>
                    <div class="editar-foto-controles">
                        <div id="editar-foto-acciones" class="oculto">
                            <button type="button" id="btn-rotar-foto" class="btn btn-secundario btn-pequeno"><i class="ti ti-rotate-clockwise-2" style="font-size: 1.4rem;"></i></button>
                        </div>
                        <input type="file" id="editar-foto-input" accept="image/jpeg,image/png,image/webp,image/gif">
                        <label>
                            <input type="checkbox" id="editar-eliminar-foto"> Eliminar foto actual
                        </label>
                    </div>
                </div>
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" id="editar-revisado"> Marcado como revisado
                </label>
            </div>

            <input type="hidden" id="editar-id">

            <div class="modal-acciones">
                <button id="btn-eliminar-producto" class="btn btn-peligro btn-pequeno">Eliminar</button>
                <div style="flex: 1;"></div>
                <button id="btn-cancelar-editar" class="btn btn-secundario">Cancelar</button>
                <button id="btn-guardar-editar" class="btn btn-primario">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
